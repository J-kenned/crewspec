[project]
name = "crewspec"
version = "0.1.0"
description = "Declarative spec and runtime for composable AI agents and teams"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "John Kennedy", email = "me@johnkennedy.ie" }
]
keywords = ["ai", "agents", "mcp", "llm", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "click>=8",
    "pydantic>=2",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/J-kenned/crewspec"
Repository = "https://github.com/J-kenned/crewspec"
Issues = "https://github.com/J-kenned/crewspec/issues"

[project.scripts]
crewspec = "crewspec.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "black",
    "ruff",
    "pre-commit",
    "types-PyYAML",
]

[tool.black]
line-length = 88
target-version = ["py312", "py313"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/crewspec"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
