# Run `pre-commit install` once to enable these on every commit.
# black / ruff / mypy run via `uv run` so they use the versions pinned in
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + import sort)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
